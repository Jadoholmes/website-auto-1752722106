<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact us for inquiries"> 
    <link rel="canonical" href="/contact.html">
    <title>Contact Us | Budgeting Tools</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script>
        function validateForm() {
            var name = document.forms["contactForm"]["name"].value;
            var email = document.forms["contactForm"]["email"].value;
            if (name == "" || email == "") {
                alert("Name and email must be filled out");
                return false;
            }
            return true;
        }
    </script>
</head>
<body class="bg-gray-100">
    <header class="bg-blue-600 text-white p-4">
        <h1 class="text-3xl">Contact Us</h1>
    </header>
    <nav class="sticky top-0 bg-white shadow-md p-2">
        <ul class="flex space-x-4">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="privacy-policy.html">Privacy Policy</a></li>
            <li><a href="terms-of-service.html">Terms of Service</a></li>
        </ul>
    </nav>
    <main class="p-4">
        <form name="contactForm" onsubmit="return validateForm()" class="bg-white p-4 rounded shadow-md">
            <div class="mb-4">
                <label for="name" class="block">Name:</label>
                <input type="text" id="name" name="name" class="border p-2 w-full">
            </div>
            <div class="mb-4">
                <label for="email" class="block">Email:</label>
                <input type="email" id="email" name="email" class="border p-2 w-full">
            </div>
            <div class="mb-4">
                <label for="message" class="block">Message:</label>
                <textarea id="message" name="message" class="border p-2 w-full"></textarea>
            </div>
            <button type="submit" class="bg-blue-600 text-white p-2 rounded">Send</button>
        </form>
    </main>
    <footer class="bg-gray-800 text-white p-4 mt-4">
        <p>&copy; 2023 Budgeting Tools. All rights reserved.</p>
    </footer>
</body>
</html>
